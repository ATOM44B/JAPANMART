<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://img.komehyo.jp">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>JAPANMART - Japan to Thailand resale radar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23000'/%3E%3Cpath d='M9 21l5-10 4 7 2-4 3 7' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script>try{var t=JSON.parse(localStorage.getItem('scout.theme')||'"light"');document.documentElement.dataset.theme=t==='dark'?'dark':'light'}catch(e){}</script>
<style>
:root{--bg:#fff;--ink:#000;--mute:#666;--line:#dcdcdc;--fill:#f3f3f3;--on:#fff;--pad:16px}
html[data-theme="dark"]{--bg:#000;--ink:#fff;--mute:#9a9a9a;--line:#2c2c2c;--fill:#161616;--on:#000}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;color-scheme:light}
html[data-theme="dark"]{color-scheme:dark}
body{font-family:Aptos,"Aptos Display","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4;overflow-x:hidden;padding-bottom:calc(76px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
button,input,select{font:inherit;color:inherit}
html{-webkit-tap-highlight-color:transparent}
button,a,label,summary{touch-action:manipulation}
button{background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding:0 var(--pad)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mute{color:var(--mute)}
small{font-size:12px}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);margin:0 calc(var(--pad) * -1);padding:calc(8px + env(safe-area-inset-top)) var(--pad) 0;transition:transform .22s ease,box-shadow .2s}
.topbar.stuck{box-shadow:0 1px 0 var(--line)}
.topbar.hide{transform:translateY(-110%)}
.srow{display:flex;gap:8px}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:46px;padding:0 12px;border:1.5px solid var(--ink);border-radius:12px}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px}
.search input::placeholder{color:var(--mute)}
.search .clr{display:none;width:24px;height:24px;border-radius:50%;place-items:center;background:var(--fill)}
.search.has .clr{display:grid}
.iconbtn{width:46px;height:46px;flex:none;display:grid;place-items:center;border:1.5px solid var(--line);border-radius:12px}
.wishhead{display:none;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top)) 0 6px}
.wishhead h1{font-size:24px;line-height:1.1}
body[data-page="wish"] .homeonly,body[data-page="wish"] .topbar{display:none}
body[data-page="wish"] .wishhead{display:flex}

/* controls */
.ctl{display:flex;gap:8px;align-items:center;margin:2px 0 8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;flex:none;height:36px;padding:0 12px;border:1.5px solid var(--line);border-radius:999px;font-size:13px;white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--on);border-color:var(--ink)}
.pill .dotstat{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.55}
.pill.live .dotstat{opacity:1}
.grow{flex:1}
.cats{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;margin:10px calc(var(--pad) * -1) 0;padding:0 var(--pad) 10px}
.cats::-webkit-scrollbar{display:none}
.cats::after{content:"";flex:none;width:1px}
.cat{flex:none;height:40px;padding:0 15px;border:1.5px solid var(--line);border-radius:999px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.cat small{font-weight:400;color:var(--mute);font-size:12.5px}
.cat[aria-pressed="true"]{background:var(--ink);color:var(--on);border-color:var(--ink)}
.cat[aria-pressed="true"] small{color:var(--on);opacity:.7}
.status{font-size:12px;line-height:1.45;color:var(--mute);margin:0 0 14px}

/* sections */
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:20px 0 10px}
.sec-h h2{font-size:19px;line-height:1.15}
.sec-h span{font-size:12.5px;color:var(--mute);text-align:right}
.picks{border-top:2px solid var(--ink);margin-bottom:6px}
.pick{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:12px 0;border-bottom:1px solid var(--line)}
.pick .n{font-size:22px;font-weight:700;line-height:1}
.pick b{display:block;font-size:14.5px;line-height:1.25}
.pick .sub{font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.pick .gain{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.pick .gain small{display:block;font-weight:400;color:var(--mute)}

/* card */
.card{border:1px solid var(--line);border-radius:6px;margin:0 0 18px;overflow:hidden;background:var(--bg);content-visibility:auto;contain-intrinsic-size:auto 680px}
.card.flash{animation:flash 1.4s ease}
@keyframes flash{0%,60%{box-shadow:0 0 0 3px var(--ink)}100%{box-shadow:0 0 0 0 transparent}}
.media{position:relative}
.car{display:flex;width:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;aspect-ratio:1/1;max-height:52vh;max-height:min(52svh,440px);background:var(--fill)}
.car::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;position:relative;display:grid;place-items:center;min-width:0;background:#fff}
.car.nophoto{aspect-ratio:16/10}
.slide.ph-slide,.slide.broken{background:var(--fill)}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;background:transparent}
.slide img.ok{background:#fff}
.glyph{width:32%;max-width:120px;height:auto;stroke:var(--mute);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.slide .cap{position:absolute;left:0;right:0;bottom:38px;text-align:center;font-size:12.5px;color:var(--mute);display:none;text-decoration:underline;padding:8px 12px;z-index:1}
.slide.ph-slide .cap,.slide.broken .cap{display:block}
.car.nophoto .slide .cap{bottom:12px}
.dots{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:6px;padding:6px 9px;border-radius:999px;background:rgba(0,0,0,.5);pointer-events:none}
.dots i{width:6px;height:6px;border-radius:50%;background:#fff;opacity:.5}
.dots i.on{opacity:1}
.tag{position:absolute;left:10px;top:10px;display:flex;gap:6px}
.tag span{box-shadow:0 1px 4px rgba(0,0,0,.22);background:var(--bg);border:1px solid var(--ink);border-radius:999px;font-size:11.5px;font-weight:600;padding:2px 9px}
.tag .inv{background:var(--ink);color:var(--on)}
.heart,.share{box-shadow:0 1px 4px rgba(0,0,0,.22);position:absolute;top:8px;right:8px;width:44px;height:44px;border-radius:50%;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center}
.heart svg,.share svg{width:21px;height:21px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.share{top:58px}
.fld select{height:38px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);padding:0 8px;font-size:16px;max-width:150px}
.heart[aria-pressed="true"] svg{fill:var(--ink)}
.info{padding:14px 14px 4px}
.brand{font-size:12.5px;font-weight:700;letter-spacing:.02em}
.title{font-size:17px;line-height:1.22;font-weight:700;margin:1px 0 2px}
.desc{font-size:13px;color:var(--mute)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12px;color:var(--mute);white-space:nowrap}
.price{display:flex;align-items:baseline;gap:10px;margin:12px 0 4px;font-variant-numeric:tabular-nums}
.price b{font-size:22px;line-height:1}
.price small{font-size:12px;font-weight:600;margin-left:3px;color:var(--mute)}
.price .sep{color:var(--line);font-size:20px}
.th-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px 6px;font-size:13px;font-weight:700}
.scen{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.scen>div{padding:10px 14px;border-left:1px solid var(--line);min-width:0}
.scen>div:first-child{border-left:0}
.scen span{display:block;font-size:12px;color:var(--mute)}
.scen b{display:block;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{position:relative;height:18px;margin:6px 18px 2px}
.bar::before{content:"";position:absolute;left:0;right:0;top:8px;height:2px;background:var(--line)}
.bar .d{position:absolute;top:4px;width:10px;height:10px;margin-left:-5px;border-radius:50%;border:2px solid var(--ink);background:var(--bg)}
.bar .d.m{background:var(--ink)}
.bar .c{position:absolute;top:0;width:3px;height:18px;margin-left:-1.5px;background:var(--ink)}
.pl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 14px 10px}
.pl .lc{font-size:12.5px;color:var(--mute)}
.pl .lc b{display:block;color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}
.pc{border:1.5px solid var(--ink);border-radius:8px;padding:5px 10px;text-align:right;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;line-height:1.15}
.pc small{display:block;font-weight:400;font-size:11.5px}
.pc.pos{background:var(--ink);color:var(--on)}
.pc.neg{color:var(--mute);border-color:var(--line)}
details.bd{margin:0 14px 12px;font-size:13px}
details.bd summary{cursor:pointer;color:var(--mute);padding:4px 0;list-style:none}
details.bd summary::-webkit-details-marker{display:none}
details.bd summary::after{content:" +"}
details.bd[open] summary::after{content:" \2212"}
details.bd dl{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:6px 0;font-variant-numeric:tabular-nums}
details.bd dt{color:var(--mute)}
details.bd dd{text-align:right}
details.bd .tot{font-weight:700;border-top:1px solid var(--line);padding-top:4px;margin-top:2px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 14px 14px}
.btn{height:44px;border-radius:10px;border:1.5px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:14px;text-align:center;padding:0 8px}
.btn.fill{background:var(--ink);color:var(--on)}

.tail{margin:6px 0 24px;display:grid;gap:8px}
.tail .btn{font-weight:600}
.empty{padding:36px 8px;text-align:center;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

/* bottom nav */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr}
.tabbar button{height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--mute);position:relative}
.tabbar button[aria-current="page"]{color:var(--ink);font-weight:700}
.tabbar button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;background:var(--ink)}
.badge{position:absolute;top:8px;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:9px;background:var(--ink);color:var(--on);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,0);transition:background .2s}
.sheet.open{background:rgba(0,0,0,.5)}
.sheet .panel{width:100%;max-width:520px;max-height:86vh;max-height:88dvh;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom));transform:translateY(24px);opacity:0;transition:transform .2s,opacity .2s}
.sheet.open .panel{transform:none;opacity:1}
.sh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.sh-top h3{font-size:19px;line-height:1.2}
.sh-close{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none}
.sh-body h4{font-size:14px;margin:18px 0 6px}
.sh-body p{font-size:13.5px;color:var(--mute)}
.rows{border-top:1px solid var(--line)}
.rows>*{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px;font-variant-numeric:tabular-nums}
.rows a{font-weight:600}
.rows small{color:var(--mute);display:block;font-weight:400}
.fld{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.fld input[type=number]{width:104px;height:38px;border:1.5px solid var(--line);border-radius:8px;background:transparent;padding:0 10px;text-align:right;font-size:16px}
.fld input[type=checkbox]{width:22px;height:22px;accent-color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.form{display:grid;gap:8px}
.form input,.form select{width:100%;height:44px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px;font-size:16px}
.form input:focus,.form select:focus{border-color:var(--ink);outline:0}
.lnk{background:none;border:0;padding:4px 0;color:var(--ink);text-decoration:underline;font:inherit;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:var(--ink);color:var(--on);padding:9px 16px;border-radius:999px;font-size:13.5px;opacity:0;pointer-events:none;transition:.2s;z-index:60;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:460px){.grid2{grid-template-columns:1fr}}
@media (max-width:380px){:root{--pad:14px}.scen>div{padding:10px 12px}.price b{font-size:21px}}
@media (min-width:410px){:root{--pad:20px}body{font-size:16px}.title{font-size:19px}.brand{font-size:13px}.desc{font-size:14px}.price b{font-size:24px}.scen b{font-size:17px}.scen span,.chip{font-size:12.5px}.pick b{font-size:15.5px}.sec-h h2{font-size:21px}.info{padding:16px 16px 4px}.th-h{padding:12px 16px 6px}.scen>div{padding:12px 16px}.pl{padding:10px 16px 12px}details.bd{margin:0 16px 14px}.acts{padding:0 16px 16px}.btn{height:48px;font-size:15px}.pc{font-size:17px}.tag{left:12px;top:12px}.heart{top:10px;right:10px}.share{top:64px;right:10px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  var net=function(x){return x*(1-c.fee/100)};
  var r={list:p.jpy*fx,base:base,proxy:proxy,ship:ship,duty:duty,vat:vat,landed:landed};
  r.pq=net(p.th.q)-landed;r.pm=net(p.th.m)-landed;r.ps=net(p.th.s)-landed;r.roi=r.pm/landed;
  return r;
}
function matches(p,q){

  return q.toLowerCase().split(/\s+/).filter(Boolean).every(function(t){return hay.indexOf(t.replace(/[\s\-_.\/]/g,''))>-1});
}

  return S.items.filter(function(p){return matches(p,S.q)&&(S.src==='all'||p.src===S.src)&&(!cfg.capOn||p.jpy*S.fx<=cfg.cap)}).map(function(p){return{p:p,c:calc(p)}});

var BATCH=8,moreIO=null;
function mountCards(head,items,render,tail){ // first screenful now, the rest as you scroll

  feed.innerHTML=head+'<div id="list"></div><div id="more" aria-hidden="true"></div>'+(tail||'');
  var list=$('#list'),more=$('#more'),n=0;
  function next(){
    if(n>=items.length)return false;
    var end=Math.min(items.length,n+BATCH),h='';
    for(;n<end;n++)h+=render(items[n],n);
    list.insertAdjacentHTML('beforeend',h);
    return n<items.length;
  }
  if(!next())return;
  if(typeof IntersectionObserver==='undefined'){while(next());return}
  moreIO=new IntersectionObserver(function(es){
    if(!es[0].isIntersecting)return;
    if(next()){moreIO.unobserve(more);moreIO.observe(more)}else{moreIO.disconnect();moreIO=null}

function safeUrl(u){return /^https?:\/\//i.test(u||'')?String(u):''}

function nk(s){return String(s||'').toLowerCase().replace(/[^0-9a-z\u3040-\u30ff\u4e00-\u9fff]/g,'')}
function rnd(x){var st=x<30000?100:500;return Math.round(x/st)*st}
function keyMatch(a,b){return !!a&&!!b&&(a===b||(a.length>=5&&b.length>=5&&(a.indexOf(b)>-1||b.indexOf(a)>-1)))}
function med(v){v=v.slice().sort(function(a,b){return a-b});var h=v.length>>1;return v.length%2?v[h]:(v[h-1]+v[h])/2}
function priced(p){
  var ks=[nk(p.sq),nk(p.model)].filter(Boolean);
  var mine=UC.filter(function(c){var k=nk(c.k);return ks.some(function(x){return keyMatch(x,k)})});
  var have=[],seen={};
  (p.comps||[]).concat(mine.map(function(c){return{s:c.s,st:c.st,thb:c.thb,url:c.url,note:c.note}})).forEach(function(c){var id=c.s+'|'+c.thb+'|'+(c.url||'');if(!seen[id]){seen[id]=1;have.push(c)}});
  var n=have.length;
  if(!p.mkt&&p.th&&!n)return Object.assign({},p,{th:Object.assign({},p.th,{basis:'legacy',n:0})});
  var f=(cfg.used&&cfg.used[p.cat])||1.2,est=p.mkt?p.mkt*S.fx*f:(p.th?p.th.m:p.jpy*S.fx*f),m,conf,basis;
  if(n>=3){m=med(have.map(function(c){return c.thb}));conf=n>=5?'H':'M';basis='comps'}
  else if(n){m=(med(have.map(function(c){return c.thb}))+est)/2;conf='M';basis='blend'}
  else{m=est;conf='L';basis='estimate'}
  m=rnd(m);var q=rnd(m*.88),sg=rnd(m*1.12);if(!(q<m))q=m-100;if(!(m<sg))sg=m+100;
  return Object.assign({},p,{comps:have,th:{q:q,m:m,s:sg,conf:conf,n:n,basis:basis,f:f}});
}
function cleanData(j){
  var arr=Array.isArray(j)?j:(j&&Array.isArray(j.items)?j.items:null);if(!arr)return null;
  var ok=[],bad=0,seen={};
  arr.forEach(function(p){
    var th=p&&p.th,thOk=th&&th.q>0&&th.m>0&&th.s>0;
    if(!p||!CATLABEL[p.cat]||p.cat==='all'||!SRC[p.src]||!(p.jpy>0)||typeof p.id!=='string'||!p.id||seen[p.id]){bad++;return}
    seen[p.id]=1;
    ok.push({id:p.id,cat:p.cat,src:p.src,brand:String(p.brand||''),model:String(p.model||''),desc:String(p.desc||''),cond:String(p.cond||''),jpy:+p.jpy,kg:+p.kg>0?+p.kg:0.5,sq:String(p.sq||p.model||''),store:String(p.store||''),
      mkt:+p.mkt>0?+p.mkt:0,mktN:+p.mktN||0,
      imgs:(Array.isArray(p.imgs)?p.imgs:[]).filter(function(u){return safeUrl(u)}).map(function(u){return /^http:\/\/(localhost|127\.|192\.168\.|10\.)/i.test(u)?u:u.replace(/^http:\/\//i,'https://')}).slice(0,8),snap:!!p.snap,url:safeUrl(p.url),
      th:thOk?{q:+th.q,m:+th.m,s:+th.s,conf:th.conf==='L'?'L':th.conf==='H'?'H':'M',n:+th.n||0,basis:String(th.basis||'')}:null,
      comps:(Array.isArray(p.comps)?p.comps:[]).filter(function(c){return c&&+c.thb>0}).map(function(c){return{s:String(c.s||'Thai listing'),st:String(c.st||'Listed'),thb:+c.thb,url:safeUrl(c.url),note:String(c.note||'')}})});
  });
  if(!ok.length)return null;
  var m=Array.isArray(j)?{}:j;
  return{source:m.source==='live'?'live':'imported',generated:String(m.generated||new Date().toISOString().slice(0,10)),generatedAt:String(m.generatedAt||''),fx:+m.fx>0.05&&+m.fx<1?+m.fx:SEED_META.fx,fxDate:String(m.fxDate||''),counts:m.counts||null,stale:(m.stale&&typeof m.stale==='object')?m.stale:null,items:ok,dropped:bad};
}

var qEl=$('#q'),qt;
qEl.addEventListener('input',function(){$('#searchBox').classList.toggle('has',!!qEl.value);clearTimeout(qt);qt=setTimeout(function(){S.q=qEl.value.trim();renderCats();renderFeed()},140)});
$('#shBody').addEventListener('change',function(e){
  var t=e.target;if(!t||t.id!=='imp'||!t.files||!t.files[0])return;
  var f=t.files[0];if(f.size>8*1024*1024){toast('That file is too large');return}
  var r=new FileReader();r.onload=function(){importText(String(r.result))};r.readAsText(f);
});
$('#shBody').addEventListener('input',function(e){
  var k=e.target.dataset&&e.target.dataset.cfg;if(!k)return;
  var v=e.target.tagName==='SELECT'?e.target.value:e.target.type==='checkbox'?e.target.checked:(parseFloat(e.target.value)||0);
  setCfg(k,v);
});
document.addEventListener('scroll',function(e){
  var t=e.target;if(!t||!t.classList||!t.classList.contains('car'))return;
  hydrate(t);
  var i=Math.round(t.scrollLeft/Math.max(1,t.clientWidth)),d=t.parentNode.querySelectorAll('.dots i');
  d.forEach(function(x,j){x.classList.toggle('on',j===i)});
},true);

['pointerdown','focusin'].forEach(function(ev){document.addEventListener(ev,function(e){var c=e.target&&e.target.closest?e.target.closest('.car'):null;if(c)hydrate(c)},true)});

/* ---------- data ---------- */
function fetchJSON(url,ms){
  var ctl=typeof AbortController!=='undefined'?new AbortController():null,timer=ctl&&setTimeout(function(){ctl.abort()},ms||5000);
  return fetch(url,{cache:'no-store',signal:ctl&&ctl.signal}).then(function(r){clearTimeout(timer);if(!r.ok)throw 0;return r.json()});
}
function loadData(){
  S.lastLoad=Date.now();
  return fetchJSON('data/products.json?'+Date.now(),6000).then(function(j){
    var d=cleanData(j);if(!d)return false;
    var same=function(a,b){return !!a&&!!b&&a.generatedAt===b.generatedAt&&a.generated===b.generated&&a.items.length===b.items.length};
    var changed=!(same(d,HOSTED)||(!HOSTED&&same(d,EMB)));   // the copy baked into the page counts as already loaded
    HOSTED=d;if(changed)pickData();return changed;
  }).catch(function(){return false});
}
function loadFx(){
  var urls=['https://open.er-api.com/v6/latest/JPY','https://api.frankfurter.dev/v1/latest?base=JPY&symbols=THB'];
  return urls.reduce(function(pr,u){return pr.catch(function(){return fetchJSON(u,4000).then(function(j){var v=j&&j.rates&&j.rates.THB;if(!(v>0.05&&v<1))throw 0;return v})})},Promise.reject()).then(function(v){var old=S.fx;S.fxLive=v;applyFx();if(Math.abs(S.fx-old)/old>0.0004)renderAll();else renderCtl()}).catch(function(){});
}

(function(){ // header hides while scrolling down and returns on any upward scroll
  var last=0,busy=false,hb=$('#topbar');
  window.addEventListener('scroll',function(){if(busy)return;busy=true;requestAnimationFrame(function(){
    busy=false;var y=Math.max(0,window.pageYOffset||0),d=y-last;
    hb.classList.toggle('stuck',y>4);
    if(y<80||document.activeElement===qEl)hb.classList.remove('hide');
    else if(d>8)hb.classList.add('hide');else if(d<-8)hb.classList.remove('hide');
    last=y})},{passive:true});
})();
setTheme(document.documentElement.dataset.theme==='dark'?'dark':'light');
applyFx();
try{EMB=cleanData(JSON.parse(document.getElementById('scout-data').textContent))}catch(e){}
pickData();applyFx();renderAll();            // paint at once from the data inside this file
function autoRefresh(){loadData().then(function(ch){if(ch){applyFx();renderAll()}else{$('#status').innerHTML=statusText()+' <button class="lnk" data-act="refresh">Refresh</button> <button class="lnk" data-act="data">Data</button>'}})}
setTimeout(autoRefresh,4000);                // let the page paint and start its first photos before any extra download
setInterval(autoRefresh,600000);             // keep a page that stays open fresh
document.addEventListener('visibilitychange',function(){if(!document.hidden&&Date.now()-(S.lastLoad||0)>300000)autoRefresh()});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&S.pendingShare)checkTg(false)});
fetchJSON('data/app.json?'+Date.now(),4000).then(function(j){if(j&&typeof j==='object')S.app=j}).catch(function(){});
setTimeout(loadFx,2500);
})();
</script>
</body>
