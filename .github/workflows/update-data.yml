name: Update data and deploy

on:
  schedule:
    - cron: "0 */3 * * *"      # every 3 hours (GitHub may start it a few minutes late)
  workflow_dispatch:            # the "Run workflow" button
  push:
    branches: [main]            # also runs when you upload or edit files

concurrency:
  group: japanmart
  cancel-in-progress: false

jobs:
  # Job 1: read Komehyo and Netmall, save data/products.json in the repository.
  # A scraping problem never fails the run: if too little comes back, the last good data is kept
  # and the reason is written to data/scrape_status.json.
  update:
    # Runs on GitHub's servers by default. If Komehyo or Netmall refuse those (HTTP 403 or 500 in data/scrape_status.json),
    # set the repository variable SCRAPER_RUNNER to self-hosted to run this job on your own computer. See README.md.
    runs-on: ${{ vars.SCRAPER_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}        # always start from the newest commit, also when a run is repeated

      - name: Check the upload is complete
        run: |
          missing=""
          for f in index.html data/products.json scraper/scrape.py scraper/config.json scraper/requirements.txt; do
            if [ ! -f "$f" ]; then
              echo "::error title=A file is missing from the repository::$f was not found. index.html, data/ and scraper/ must be at the top level of the repository, not inside another folder. Upload them again."
              missing=1
            fi
          done
          [ -z "$missing" ]

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: pip install -r scraper/requirements.txt

      - name: Fetch listings from Komehyo and Netmall
        run: python scraper/scrape.py

      # If the plain fetch found nothing, try once more the way a browser loads pages.
      # This step never fails the run. What happened is written to data/scrape_status.json.
      - name: Try again with a real browser if the first fetch found nothing
        continue-on-error: true
        run: |
          if python -c "import json,sys; sys.exit(0 if json.load(open('data/scrape_status.json')).get('ok') else 1)"; then
            echo "The first fetch worked, no retry needed."
            exit 0
          fi
          pip install playwright
          if [ "$RUNNER_OS" = "Linux" ]; then python -m playwright install --with-deps chromium; else python -m playwright install chromium; fi
          python scraper/scrape.py --browser

      - name: Save refreshed data to the repository
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          git config user.name "japanmart-bot"
          git config user.email "japanmart-bot@users.noreply.github.com"
          mkdir -p /tmp/keep
          stage() {
            for f in data/products.json data/scrape_status.json; do
              [ -f "$f" ] && cp "$f" /tmp/keep/ && git add -- "$f"
            done
            return 0
          }
          stage
          if git diff --cached --quiet; then echo "No data changes to save."; exit 0; fi
          git commit -m "data: update $(date -u +'%F %H:%M') UTC"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${BRANCH}"; then exit 0; fi
            echo "Push rejected because the repository has newer commits. Refreshing and trying again (attempt ${attempt} of 3)."
            git fetch origin "${BRANCH}"
            git reset --hard "origin/${BRANCH}"
            cp /tmp/keep/* data/
            stage
            if git diff --cached --quiet; then echo "Data is already up to date."; exit 0; fi
            git commit -m "data: update $(date -u +'%F %H:%M') UTC"
          done
          echo "::error title=Could not save the data::GitHub kept rejecting the push. Run the workflow again with Actions > Update data and deploy > Run workflow."
          exit 1

  # Job 2: publish the site. It is a separate job, so the data above is saved even if Pages is not set up yet,
  # and the site is still published (with the last good data) if the data job had a problem.
  deploy:
    needs: update
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}        # newest commit, including the data saved by the job above

      - name: Check that GitHub Pages is switched on
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! source=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null); then
            echo "::error title=GitHub Pages is not turned on::Open the repository Settings > Pages, set Source to 'GitHub Actions', then run this workflow again (Actions > Update data and deploy > Run workflow). The repository must be Public on a free account."
            exit 1
          fi
          if [ "$source" != "workflow" ]; then
            echo "::error title=GitHub Pages source is wrong::Settings > Pages > Source is '$source'. Change it to 'GitHub Actions', then run this workflow again."
            exit 1
          fi

      - name: Build the site (the data is baked into the page)
        run: |
          mkdir -p _site/data
          python3 scraper/embed.py index.html data/products.json _site/index.html
          cp data/products.json _site/data/
          cp data/scrape_status.json _site/data/ 2>/dev/null || true
          cp data/app.json _site/data/ 2>/dev/null || true
          cp -r icons _site/icons 2>/dev/null || true
          cp manifest.webmanifest _site/ 2>/dev/null || true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v5
